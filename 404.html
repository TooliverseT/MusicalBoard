<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>MusicalBoard — Redirecting…</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            color: #e4e7ec;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #242a42 100%);
        }
        .box {
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 22rem;
        }
        .box h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
            color: #f0f2f8;
        }
        .box p {
            margin: 0 0 1.25rem;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #9aa3b8;
        }
        .box a {
            display: inline-block;
            padding: 0.65rem 1.25rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
    <script>
        (function() {
            const validRoutes = [
                '/',
                '/singing-recorder/',
                '/vocal-pitch-monitor/',
                '/audio-spectrum-analyzer/',
                '/online-metronome/',
                '/vocal-scales/',
                '/vocal-range-test/',
                '/virtual-piano/',
                '/about/',
                '/privacy/',
                '/terms/',
                '/contact/',
                '/blog/',
                '/blog/2026-04-30-musicalboard-introduction/',
                '/blog/2026-05-01-vocal-intonation/',
                '/blog/2026-05-02-vocal-range/',
                '/blog/2026-05-03-sing-flat/',
                '/blog/2026-05-03-vibrato/',
                '/blog/2026-05-05-scales/'
            ];
            const legacyRouteRedirects = {
                '/pitch-controls/': '/singing-recorder/',
                '/pitch-plot/': '/vocal-pitch-monitor/',
                '/amplitude-visualizer/': '/audio-spectrum-analyzer/',
                '/metronome/': '/online-metronome/',
                '/scale-generator/': '/vocal-scales/',
                '/piano-keyboard/': '/virtual-piano/',
                '/vocal-range-map/': '/vocal-range-test/'
            };
            const segment = window.location.pathname;

            function createMetaTag(path) {
                const meta = document.createElement('meta');
                meta.setAttribute('http-equiv', 'refresh');
                meta.setAttribute('content', `0; url=${path}`);
                document.getElementsByTagName('head')[0].appendChild(meta);
            }

            let redirectTarget = '/';
            if (legacyRouteRedirects[segment]) {
                redirectTarget = legacyRouteRedirects[segment];
                sessionStorage.removeItem('redirect');
            } else if (validRoutes.includes(segment)) {
                redirectTarget = segment;
                sessionStorage.redirect = window.location.href;
            } else {
                sessionStorage.removeItem('redirect');
            }

            createMetaTag(redirectTarget);
            window.location.replace(redirectTarget);
        })();
    </script>
</head>
<body>
    <div class="box">
        <h1>Opening MusicalBoard…</h1>
        <p>If you are not redirected automatically, use the link below.</p>
        <a href="/">Back to MusicalBoard</a>
    </div>
</body>
</html>
